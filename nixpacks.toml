[phases.setup]
nixPkgs = ["...", "python3", "gcc", "gnumake"]

[phases.install]
cmds = [
  "rm -rf node_modules",
  "npm install --omit=dev --no-audit --no-fund --foreground-scripts",
  "npm rebuild sqlite3 --build-from-source --foreground-scripts",
  "test -f node_modules/sqlite3/build/Release/node_sqlite3.node"
]

[start]
cmd = "npm start"
